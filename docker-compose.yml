services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: trade_tally
      MYSQL_USER: trade_tally
      MYSQL_PASSWORD: trade_tally
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    profiles: ["app"]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_HOST: db
      ENABLE_SCHEDULER: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
