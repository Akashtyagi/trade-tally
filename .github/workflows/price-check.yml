name: Price checks

on:
  schedule:
    # 09:15–15:30 IST ≈ 03:45–10:00 UTC, weekdays
    - cron: "*/5 4-10 * * 1-5"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call run-checks webhook
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set APP_URL and CRON_SECRET repository secrets after deploying."
            exit 0
          fi
          curl -fsS -X POST "${APP_URL%/}/internal/run-checks" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json"
